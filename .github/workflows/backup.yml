name: Backup diário Supabase

on:
  schedule:
    - cron: "0 6 * * *"      # 06:00 UTC = 03:00 (horário de Brasília)
  workflow_dispatch:          # permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Gerar backup
        env:
          SUPABASE_URL: https://apluerrzjiijhhlkyumq.supabase.co
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: node scripts/backup.mjs

      - name: Commitar backup (se mudou)
        run: |
          git config user.name "backup-bot"
          git config user.email "backup@users.noreply.github.com"
          git add backups/
          if git diff --cached --quiet; then
            echo "Nada para commitar (base vazia ou sem alteração)."
          else
            git commit -m "backup: $(TZ=America/Sao_Paulo date +'%A %Y-%m-%d %H:%M')"
            git push
          fi
